<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DA7B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7C1B" />
    </linearGradient>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1B6C" />
      <stop offset="100%" stop-color="#350C36" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(15, 10)">
    <!-- Decorative Outer Ring -->
    <circle cx="40" cy="40" r="36" fill="url(#plumGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="40" cy="40" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3" />
    
    <!-- Stylized 'M' with sparkle / floral flourish -->
    <path d="M26 56 V30 L40 46 L54 30 V56" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="23" r="3.5" fill="url(#goldGrad)" />
    <!-- Mini star sparkles -->
    <path d="M40 12 L41.5 17 L46 17.5 L42 20.5 L43.5 25 L40 22 L36.5 25 L38 20.5 L34 17.5 L38.5 17 Z" fill="#D4AF37" transform="scale(0.4) translate(60, 15)" />
  </g>

  <!-- Typography -->
  <text x="105" y="46" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#4A154B" letter-spacing="1.5">MIRACLE</text>
  <text x="106" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D4AF37" letter-spacing="3.5">BEAUTY &amp; HAIR SALON</text>
  <text x="106" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#6B6168" letter-spacing="1">PAREL, MUMBAI • L'ORÉAL PARTNER</text>
</svg>
